spring.application.name=fitness

# Local dev: file-based H2 in PostgreSQL mode, so no Docker or database install is
# needed (see teaz_pro/docs/TECH_STACK.md). Prod uses Postgres from compose.yml.
spring.datasource.url=jdbc:h2:file:./data/fitness-dev;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=

# Errors as RFC 9457 problem details, so the UI can show their "detail".
spring.mvc.problemdetails.enabled=true

# Strava API app (strava.com/settings/api). Unset = made-up sample runs and a
# fake "Connect with Strava" that comes straight back, so local dev stays
# offline, like the mock auth. To try the real Strava locally, set
# FITNESS_STRAVA_CLIENT_ID and FITNESS_STRAVA_CLIENT_SECRET in the backend's
# environment (Strava allows localhost as callback domain).
fitness.strava.client-id=
fitness.strava.client-secret=
# The frontend page Strava sends the user back to (Vite dev server here).
fitness.strava.redirect-uri=http://localhost:5173/strava/callback
# How often each connected user's runs are fetched in the background.
fitness.strava.sync-interval=15m
# How far back the first sync after connecting goes.
fitness.strava.backfill-weeks=52
# Each sync fetches again from this long before the previous one (edited/deleted runs).
fitness.strava.resync-window=14d
