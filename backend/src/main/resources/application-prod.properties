# Activate with SPRING_PROFILES_ACTIVE=prod.
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://auth.teaz.pro/realms/teazpro

# Database: the shared Postgres server on the VPS, database and user "fitness".
# Connection only from the environment (.env, see README), never from this file:
# SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD.
# Schema by Flyway (db/migration) as the database's owner.

# Strava API app: FITNESS_STRAVA_CLIENT_ID and FITNESS_STRAVA_CLIENT_SECRET from
# the environment (.env, see README). Its "Authorization Callback Domain" is
# fitness.teaz.pro.
fitness.strava.redirect-uri=https://fitness.teaz.pro/strava/callback

# Apps allowed to read /api/runs/latest and /api/runs/weekly from the browser (comma-separated).
fitness.cors.allowed-origins=https://portal.teaz.pro
