# Tests: an in-memory database per Spring context, sample Strava unless a test replaces it.
# Combined with "prod" in SecurityConfigTests to test the real security
# rules without Postgres or the network.
spring.datasource.url=jdbc:h2:mem:fitness-test-${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
fitness.strava.client-id=
fitness.strava.client-secret=
# Tests sync themselves, never in the background.
fitness.strava.sync-check=1d
